<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B30">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>عين الفرس – إدارة التوصيل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
/* Layout: pine-green app bar, one column that widens to a card grid on desktop, bottom tab bar on phones,
   order cards styled like parcel labels (dashed tear line), bottom sheets for details and confirmations. */
:root{
  --bg:#F2F5F0;--surface:#FFFFFF;--surface-2:#E9EEE7;--ink:#14231D;--ink-2:#4F5F57;--line:#D8DFD6;
  --brand:#0E3B30;--brand-2:#1A5646;--on-brand:#F1F6F2;--on-brand-2:#A9C4B8;--hl:rgba(255,255,255,.16);
  --gold:#D9A024;--gold-ink:#2E2100;--gold-soft:#F7ECD0;
  --sel:#0E3B30;--on-sel:#F1F6F2;--nav-on:#0E3B30;--focus:#0E3B30;--ring:rgba(14,59,48,.18);
  --ok:#17794A;--on-ok:#FFFFFF;--ok-bg:#DCF1E5;--ok-fg:#0F5C37;
  --info-bg:#DEE9F6;--info-fg:#1F528C;
  --pend-bg:#E5EAEC;--pend-fg:#4B5A61;
  --bad:#B3362A;--on-bad:#FFFFFF;--bad-bg:#F8E0DC;--bad-fg:#8F2A20;
  --warn-bg:#F8EBCB;--warn-fg:#7A5200;
  --shadow:0 1px 2px rgba(14,59,48,.08),0 8px 24px rgba(14,59,48,.10);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  direction:rtl;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512;--surface:#17211D;--surface-2:#202C27;--ink:#E9F0EB;--ink-2:#9DB0A6;--line:#2B3A33;
  --brand:#12362C;--brand-2:#1E5242;--on-brand:#EEF5F0;--on-brand-2:#9FBFAF;
  --gold:#E6B13A;--gold-ink:#2A1D00;--gold-soft:#3A2F14;
  --sel:#E6B13A;--on-sel:#2A1D00;--nav-on:#E6B13A;--focus:#E6B13A;--ring:rgba(230,177,58,.28);
  --ok:#4CC589;--on-ok:#06180F;--ok-bg:#16382A;--ok-fg:#7BDCA9;
  --info-bg:#18304A;--info-fg:#8DBBF0;
  --pend-bg:#25312F;--pend-fg:#B2C1C8;
  --bad:#EE7D70;--on-bad:#2B0A06;--bad-bg:#432019;--bad-fg:#F4A196;
  --warn-bg:#3A2F14;--warn-fg:#F0C463;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#17211D;--surface-2:#202C27;--ink:#E9F0EB;--ink-2:#9DB0A6;--line:#2B3A33;
  --brand:#12362C;--brand-2:#1E5242;--on-brand:#EEF5F0;--on-brand-2:#9FBFAF;
  --gold:#E6B13A;--gold-ink:#2A1D00;--gold-soft:#3A2F14;
  --sel:#E6B13A;--on-sel:#2A1D00;--nav-on:#E6B13A;--focus:#E6B13A;--ring:rgba(230,177,58,.28);
  --ok:#4CC589;--on-ok:#06180F;--ok-bg:#16382A;--ok-fg:#7BDCA9;
  --info-bg:#18304A;--info-fg:#8DBBF0;
  --pend-bg:#25312F;--pend-fg:#B2C1C8;
  --bad:#EE7D70;--on-bad:#2B0A06;--bad-bg:#432019;--bad-fg:#F4A196;
  --warn-bg:#3A2F14;--warn-fg:#F0C463;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit}
a{color:inherit}
.in{width:100%;max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:grid;gap:14px;padding-block:16px 28px}
main>*{min-width:0}
.mu{color:var(--ink-2);font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ic{flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* app bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--on-brand)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;line-height:1}
.me{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;color:inherit;cursor:pointer;padding:4px 6px 4px 10px;border-radius:16px;transition:background .15s}
.me:hover,.me:active{background:var(--hl)}
.me-t{min-width:0;line-height:1.25;text-align:end}
.me-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.me-t span{font-size:12px;color:var(--on-brand-2)}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;flex:none}
.me .ic:last-child{color:var(--on-brand-2)}
.logo .lg-bg{fill:var(--brand-2)}
.logo .lg-eye{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round}
.logo .lg-iris{fill:var(--gold)}
.logo .lg-pupil{fill:var(--brand)}
.logo .lg-hl{fill:var(--on-brand)}

/* navigation: bottom bar on phones, pills on desktop */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;gap:4px;padding-block:6px}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink-2);font-size:11.5px;font-weight:600;padding:4px 2px;border-radius:12px;cursor:pointer}
.nav button.on{color:var(--nav-on)}
.ip{position:relative;display:grid;place-items:center;height:30px;width:58px;border-radius:99px;transition:background .18s}
.nav button.on .ip{background:var(--gold-soft)}
.dot{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 4px}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-fg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:36px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px}
.f{display:grid;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 4px var(--ring)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.err{min-height:20px;color:var(--bad-fg);font-size:13.5px;font-weight:600}
.pw{position:relative;direction:ltr}
.pw input{padding-inline-end:50px}
.eye{position:absolute;inset-inline-end:3px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;background:none;border:0;color:var(--ink-2);cursor:pointer;border-radius:10px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ct{font-size:15px;font-weight:700;margin-bottom:10px}
.pg h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.25;text-wrap:balance}
.pg p{margin-top:2px;color:var(--ink-2);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--pend-bg);color:var(--pend-fg)}
.badge.out{background:var(--info-bg);color:var(--info-fg)}
.badge.delivered{background:var(--ok-bg);color:var(--ok-fg)}
.badge.failed{background:var(--bad-bg);color:var(--bad-fg)}
.badge.atoffice{background:var(--warn-bg);color:var(--warn-fg)}
.badge.returned{background:var(--surface-2);color:var(--ink-2)}
.why{font-size:13px;font-weight:600;color:var(--warn-fg);background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.ret{border-color:var(--warn-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.code{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--surface-2);border-radius:8px;padding:2px 9px;font-weight:700;letter-spacing:.04em;font-size:14px;font-variant-numeric:tabular-nums}

/* filters */
.tools{display:grid;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chp{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s}
.chp b{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chp.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.chp.on b{color:inherit}
.chp.hot b{background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:0 7px}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search input{padding-inline-start:44px}

/* order cards */
.ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.oc{display:grid;gap:10px;padding:14px;cursor:pointer;transition:border-color .15s}
.oc:hover{border-color:var(--ink-2)}
.oc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc-w{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{display:inline-flex;align-items:center;gap:4px;min-width:0;background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;text-align:start}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .ic{color:var(--ink-2)}
.addr{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.mini div{display:grid;background:var(--surface-2);border-radius:10px;padding:6px 10px;min-width:0}
.mini span{font-size:11.5px;color:var(--ink-2)}
.mini b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.oc-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;border-top:2px dashed var(--line);padding-top:10px}
.oc-f select{flex:1 1 150px;width:auto;min-height:40px}
.oc-f select.needs{border-color:var(--gold);background:var(--gold-soft)}
.st{display:inline-flex;align-items:center;gap:6px}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 3px transparent}}

/* driver tasks */
.tk{display:grid;gap:12px}
.tk-n{font-size:19px;font-weight:700;line-height:1.3}
.tk-a{display:flex;align-items:flex-start;gap:8px;color:var(--ink-2)}
.tk-a .ic{margin-top:3px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 12px}
.ph .ltr{font-size:16px;font-weight:600;user-select:all}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amts div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid}
.amts div:last-child{background:var(--gold-soft)}
.amts span{font-size:12.5px;color:var(--ink-2)}
.amts b{font-size:18px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .btn{padding:0 6px;gap:6px;font-size:13.5px}
.decide{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}

/* finance */
.hero{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.hlab{font-size:14px;font-weight:600;color:var(--on-brand-2)}
.hn{font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,60px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.hn small{font-family:var(--font);font-size:15px;font-weight:600;color:var(--on-brand-2);margin-inline-start:8px}
.calc{display:flex;flex-wrap:wrap;gap:6px 20px;border-top:1px solid var(--hl);padding-top:12px;font-size:13.5px;color:var(--on-brand-2)}
.calc b{color:var(--on-brand);font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hs{font-size:14px;color:var(--on-brand-2);text-align:end}
.hs b{color:var(--on-brand);font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:99px;background:var(--hl);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.tiles{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--ink-2)}
.tile b{font-size:21px;font-variant-numeric:tabular-nums}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 6px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:700}
.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.zc{display:grid;gap:10px}
.zc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px}
.zc-f{display:flex;align-items:center;gap:8px}
.zc-f input{max-width:110px}
.zc .fee{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.av2{width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.ut{flex:1;min-width:0}
.ut b{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid}
.kv span{font-size:12.5px;color:var(--ink-2)}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.sum{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.sum b{font-variant-numeric:tabular-nums}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty .ei{width:60px;height:60px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.empty b{color:var(--ink);font-size:16px}
.empty span{max-width:30ch;font-size:14px}

/* login */
.lhero{background:var(--brand);color:var(--on-brand);padding-block:34px 70px;border-radius:0 0 32px 32px}
.lh{display:flex;align-items:center;justify-content:center;gap:14px}
.lh h1{font-family:var(--display);font-weight:400;font-size:54px;line-height:1}
.lbody{max-width:460px;margin:-40px auto 0;display:grid;gap:14px;padding-bottom:28px}
.lform{display:grid;gap:14px;box-shadow:var(--shadow)}
.lform .ct{margin:0;font-size:17px}
.demo{display:grid;gap:8px;justify-items:center}

/* sheets: bottom sheet on phones, centered dialog on desktop */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;box-shadow:var(--shadow);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh .ct{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ask{font-size:17px;font-weight:600;line-height:1.5;padding-top:4px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.dl{display:grid}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dl div:last-child{border-bottom:0}
.dl span{color:var(--ink-2)}
.dl b{font-variant-numeric:tabular-nums;text-align:end}
.sub{font-size:13px;font-weight:700;color:var(--ink-2)}
.tl{display:grid;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding-inline-start:26px;padding-bottom:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;inset-inline-start:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);box-shadow:0 0 0 3px var(--surface)}
.tl li.ok::after{background:var(--ok)}
.tl li.bad::after{background:var(--bad)}
.tl li.info::after{background:var(--info-fg)}
.tl li.warn::after{background:var(--warn-fg)}
.tl b{display:block;font-size:14px}
.tl span{font-size:12.5px;color:var(--ink-2)}
.acc summary{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;color:var(--ink-2)}
.acc[open] summary::after{content:"–"}
.accb{display:grid;gap:12px;padding:14px 2px 2px}

/* ---- monthly closing ---- */
function closeMonth(label){
  var fin=S.orders.filter(function(o){return o.status=='delivered'||o.status=='returned'});
  if(!fin.length)return false;
  var dl=fin.filter(function(o){return o.status=='delivered'}),rt=fin.filter(function(o){return o.status=='returned'}),bz={};
  dl.forEach(function(o){var z=zn(o.zone).name;bz[z]=(bz[z]||0)+1});
  S.archive.unshift({label:label,date:new Date().toLocaleString('ar-LY'),total:fin.length,delivered:dl.length,returned:rt.length,
    fees:sum(dl,'fee'),rfees:sum(rt,'rfee'),comm:sum(dl,'comm')+sum(rt,'rcomm'),drv:sum(dl,'drv')+sum(rt,'rdrv'),bz:bz});
  S.orders=S.orders.filter(function(o){return fin.indexOf(o)<0});
  return true;
}
function autoClose(){
  var d=new Date(),key=ym(d),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()==d.getDate();
  if(S.period!=key){closeMonth(S.period);S.period=key;S.closedFor=''}
  else if(last&&d.getHours()>=23&&S.closedFor!=key){closeMonth(key);S.closedFor=key}
  save();
}

  if(S.users.some(function(a){return a.u==g('uu')})){toast('اسم المستخدم موجود مسبقاً');return}
  S.users.push({u:g('uu'),p:g('up'),role:g('ur'),name:g('un')});save();render();toast('تمت إضافة الحساب')}

function showPw(u){var a=S.users.filter(function(x){return x.u==u})[0];if(!a)return;
  openSheet(shHead('كلمة مرور '+esc(a.name))+'<div class="f"><label for="np">كلمة المرور الجديدة</label><input id="np" dir="ltr" autocomplete="off" data-focus></div><button type="button" class="btn pri big block" data-u="'+esc(u)+'" onclick="setPw(this.dataset.u)">حفظ</button>')}

  else{rows=[['التحصيل من الزبون',o.cod>0?fm(o.cod):'بدون تحصيل'],['رسوم التوصيل',fm(o.fee)]];
    if(adm)rows.push(['حصة المكتب (20%)',fm(o.comm)],['حصة المندوب (80%)',fm(o.drv)]);else rows.push(['الصافي للمتجر عند التسليم',fm(o.cod-o.fee)])}

  if(adm&&o.status=='failed')act=b1+'atOffice(this.dataset.id)">'+ic('check',18)+'استلام الراجع من المندوب</button>';
  else if(adm&&o.status=='atoffice')act=b1+'toStore(this.dataset.id)">'+ic('check',18)+'تسليم الراجع للمتجر</button>';
  else if(!adm&&own&&o.status=='atoffice')act=b1+'toStore(this.dataset.id)">'+ic('check',18)+'تأكيد استلام الراجع</button>';
  return openSheet(
    '<div class="sh"><h2 class="ct"><span class="code">'+esc(o.id)+'</span>'+badge(o.status)+'</h2><button type="button" class="btn icon sm ghost" aria-label="إغلاق" onclick="closeSheet()">'+ic('x',18)+'</button></div>'+
    '<div><div class="tk-n">'+esc(o.cust)+'</div><div class="mu" style="margin-top:2px">'+esc(o.addr)+'</div><div class="row" style="margin-top:8px"><span class="chip">'+ic('pin',14)+esc(zn(o.zone).name)+'</span><span class="chip ltr">'+esc(o.phone)+'</span></div></div>'+

/* ---- shared pieces ---- */
function pg(t,s){return '<div class="pg"><h1>'+t+'</h1>'+(s?'<p>'+s+'</p>':'')+'</div>'}
function empty(i,t,h){return '<div class="empty"><div class="ei">'+ic(i,26)+'</div><b>'+t+'</b>'+(h?'<span>'+h+'</span>':'')+'</div>'}
function badge(s){return '<span class="badge '+s+'">'+ST[s]+'</span>'}
function hero(label,val,calc){return '<section class="hero"><div class="hlab">'+label+'</div><div class="hn">'+big(val)+'</div>'+(calc?'<div class="calc">'+calc.map(function(c){return '<span>'+c[0]+' <b>'+c[1]+'</b></span>'}).join('')+'</div>':'')+'</section>'}
function tiles(a){return '<div class="tiles" style="--n:'+Math.min(a.length,3)+'">'+a.map(function(k){return '<div class="tile"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join('')+'</div>'}
function sec(t,b){return '<section class="card"><h2 class="ct">'+t+'</h2>'+b+'</section>'}
function tbl(head,rows,foot){return '<div class="tb"><table><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody>'+(foot?'<tfoot>'+foot+'</tfoot>':'')+'</table></div>'}
function chips(base){
  return '<div class="chips">'+['','pending','out','delivered','ret'].map(function(k){
    var n=k=='ret'?base.filter(isOpenRet).length:k?base.filter(function(o){return o.status==k}).length:base.length;
    return '<button type="button" class="chp'+(F==k?' on':'')+(((k=='pending'&&U.role=='admin')||k=='ret')&&n?' hot':'')+'" data-k="'+k+'" onclick="setF(this.dataset.k)">'+(k=='ret'?'الرواجع':k?ST[k]:'الكل')+' <b>'+n+'</b></button>'}).join('')+'</div>'}
function search(){return '<div class="search">'+ic('search',18)+'<input id="q" type="search" placeholder="ابحث بالكود أو اسم الزبون أو الهاتف" value="'+esc(Q)+'" oninput="Q=this.value;refList()" aria-label="بحث في الطلبات"></div>'}

function finD(d,r){
  var col=sum(d,'cod'),mine=sum(d,'drv')+sum(r,'rdrv'),net=col-mine,ra=S.orders.filter(function(o){return o.driver==U.u&&isRet(o)}).length;
  var rows=d.map(function(o){return '<tr><td><span class="code">'+esc(o.id)+'</span></td><td>'+fm(o.cod)+'</td><td>'+fm(o.drv)+'</td></tr>'}).concat(
    r.map(function(o){return '<tr><td><span class="code">'+esc(o.id)+'</span> <span class="chip">راجع</span></td><td>—</td><td>'+fm(o.rdrv||0)+'</td></tr>'}));
  return hero(net>=0?'المطلوب تسليمه للشركة':'مستحق لك من الشركة',Math.abs(net),[['المحصّل من الزبائن',fm(col)],['عمولتي',fm(mine)]])+
  tiles([['طلبات مسلّمة',d.length],['رواجع',ra]])+
  (rows.length?sec('تفاصيل الطلبات',tbl(['الكود','المحصّل','عمولتي'],rows,'<tr><td>الإجمالي</td><td>'+fm(col)+'</td><td>'+fm(mine)+'</td></tr>')):
   '<section class="card">'+empty('wallet','لا توجد طلبات مسلّمة بعد','تظهر هنا حساباتك بعد تسليم أول طلب.')+'</section>')}

    sec('حسب المندوب',tbl(['المندوب','طلبات','يسلّم للشركة','عمولته'],dr.map(function(d){var l=dl.filter(function(o){return o.driver==d.u}),rl=rt.filter(function(o){return o.driver==d.u}),cm=sum(l,'drv')+sum(rl,'rdrv');return '<tr><td>'+esc(d.name)+'</td><td>'+l.length+'</td><td>'+fm(sum(l,'cod')-cm)+'</td><td>'+fm(cm)+'</td></tr>'})))+

    sec('إغلاق الشهر','<p class="mu" style="margin-bottom:12px">يُغلق الشهر تلقائياً في آخر يوم منه بعد الساعة 11 مساءً، وتنتقل الطلبات المنتهية إلى الأرشيف. يمكنك الإغلاق يدوياً في أي وقت.</p><button type="button" class="btn" onclick="manualClose()">'+ic('archive',18)+'إغلاق الشهر الآن</button>')}
  if(T=='users'){
    return pg('المستخدمون','المتاجر والمندوبون الذين يمكنهم الدخول')+
    sec('الحسابات',S.users.map(function(a){return '<div class="urow"><span class="av2">'+esc(a.name.trim().charAt(0))+'</span><div class="ut"><b>'+esc(a.name)+'</b><span class="mu ltr">@'+esc(a.u)+'</span></div><span class="chip">'+RL[a.role]+'</span>'+

    '<section class="card"><h2 class="ct">إضافة حساب</h2><div class="g2"><div class="f"><label for="un">الاسم</label><input id="un"></div><div class="f"><label for="ur">الدور</label><select id="ur"><option value="store">متجر</option><option value="driver">مندوب</option></select></div>'+
    '<div class="f"><label for="uu">اسم المستخدم</label><input id="uu" dir="ltr" autocomplete="off" autocapitalize="none"></div><div class="f"><label for="up">كلمة المرور</label><input id="up" dir="ltr" autocomplete="off"></div></div>'+
    '<button type="button" class="btn pri block" style="margin-top:14px" onclick="addUser()">'+ic('plus',18)+'إضافة</button></section>'+
    sec('بيانات التجربة','<p class="mu" style="margin-bottom:12px">يحذف كل الطلبات والحسابات المضافة، ويرجّع الحسابات التجريبية.</p><button type="button" class="btn bad" onclick="resetAll()">إعادة ضبط</button>')}
  if(T=='zones'){
    return pg('الأسعار','وسط البلاد وضواحي طرابلس ثابتتان. الباقي تحدده أنت')+
    '<div class="zg">'+S.zones.map(function(z){var s=split(z.fee);
      return '<article class="card zc"><div class="zc-h"><b>'+esc(z.name)+'</b>'+(z.fixed?'<span class="chip">ثابتة</span>':'')+'</div>'+

      (z.fixed?'<div class="fee">'+fm(z.fee)+'</div>':'<div class="zc-f"><input id="z'+esc(z.id)+'" type="number" min="1" value="'+z.fee+'" aria-label="سعر '+esc(z.name)+'"><button type="button" class="btn sm pri" data-id="'+esc(z.id)+'" onclick="saveZone(this.dataset.id)">حفظ</button><button type="button" class="btn sm icon ghost" aria-label="حذف '+esc(z.name)+'" data-id="'+esc(z.id)+'" onclick="delZone(this.dataset.id)">'+ic('trash',17)+'</button></div>')+'</article>'}).join('')+'</div>'+
    retSec()+'<section class="card"><h2 class="ct">إضافة مدينة خارجية</h2><div class="g2"><div class="f"><label for="zn">اسم المدينة</label><input id="zn"></div><div class="f"><label for="zf">سعر التوصيل (د.ل)</label><input id="zf" type="number" min="1" inputmode="decimal"></div></div><button type="button" class="btn pri block" style="margin-top:14px" onclick="addZone()">'+ic('plus',18)+'إضافة</button></section>'}
  return pg('الأرشيف','تقارير الأشهر المغلقة')+(S.archive.length?S.archive.map(function(a){
    return '<section class="card"><div class="oc-h"><h2 class="ct" style="margin:0">تقرير '+esc(pl(a.label))+'</h2><span class="mu">أُغلق '+esc(a.date)+'</span></div><div class="kv">'+
    [['الطلبات المنتهية',a.total],['تم التسليم',a.delivered],['رواجع',a.returned!=null?a.returned:(a.failed||0)],['رسوم التوصيل',fm(a.fees)],['رسوم الرواجع',fm(a.rfees||0)],['عمولة المكتب',fm(a.comm)],['مستحقات المندوبين',fm(a.drv)]].map(function(k){return '<div><span>'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join('')+'</div></section>'}).join(''):

  if(T=='mine'){var base=S.orders.filter(function(o){return o.store==U.u});return pg('طلباتي','اضغط على اسم الزبون لعرض مسار الطلب')+'<div class="tools">'+chips(base)+search()+'</div><div id="ol">'+listHtml()+'</div>'}
  var z0=S.zones[0]||{fee:0},seen={},names=[];

  return pg('طلب جديد','كود التتبع القادم <span class="code">AF-'+S.next+'</span>')+

  '<div><h2 class="ct">التوصيل والتحصيل</h2><div class="g2"><div class="f"><label for="cz">المنطقة</label><select id="cz" onchange="zfee()">'+S.zones.map(function(z){return '<option value="'+esc(z.id)+'">'+esc(z.name)+' — '+num(z.fee)+' د.ل</option>'}).join('')+'</select></div>'+
  '<div class="f"><label for="cc">المبلغ المطلوب تحصيله (د.ل)</label><input id="cc" type="number" min="0" value="0" inputmode="decimal" oninput="zfee()"></div></div></div>'+

  '<div class="tk-n">'+esc(o.cust)+'</div>'+

  '<div class="ph"><span class="ltr">'+esc(o.phone)+'</span><button type="button" class="btn sm ghost" data-t="'+esc(o.phone)+'" onclick="copyTxt(this.dataset.t,\'تم نسخ الرقم\')">'+ic('copy',16)+'نسخ</button></div>'+
  '<div class="amts"><div><span>المطلوب من الزبون</span><b>'+(o.cod>0?fm(o.cod):'بدون تحصيل')+'</b></div><div><span>أجرتي</span><b>'+fm(o.drv)+'</b></div></div>'+
  '<div class="acts"><a class="btn" href="tel:'+esc(dg(o.phone))+'">'+ic('phone',18)+'اتصال</a><a class="btn" target="_blank" rel="noopener" href="'+esc(wa(o))+'">'+ic('chat',18)+'واتساب</a><a class="btn" target="_blank" rel="noopener" href="'+esc(mapUrl(o))+'">'+ic('pin',18)+'الخريطة</a></div>'+

function vDriver(){
  var l=S.orders.filter(function(o){return o.driver==U.u&&o.status=='out'}),d=S.orders.filter(function(o){return o.driver==U.u&&o.status=='delivered'});

  var tot=l.length+d.length,pct=tot?Math.round(d.length/tot*100):0;
  return pg('مهام اليوم')+
  '<section class="hero"><div class="hrow"><div><div class="hlab">متبقية</div><div class="hn">'+l.length+'</div></div><div class="hs">سلّمت <b>'+d.length+'</b> من <b>'+tot+'</b></div></div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></section>'+
  heldHtml()+(l.length?l.map(tk).join(''):'<section class="card">'+empty('nav','لا توجد مهام الآن','تظهر هنا الطلبات التي يعيّنها لك المدير.')+'</section>')}

function headH(){return '<header class="top"><div class="in"><div class="brand">'+logo(38)+'<span>عين الفرس</span></div><button type="button" class="me" aria-label="حسابي" onclick="showAccount()"><span class="me-t"><b>'+esc(U.name)+'</b><span>'+RL[U.role]+'</span></span><span class="av">'+esc(U.name.trim().charAt(0))+'</span>'+ic('down',16)+'</button></div></header>'}
function navH(){var need=S.orders.filter(function(o){return o.status=='pending'||isOpenRet(o)}).length,pk=S.orders.filter(function(o){return o.store==U.u&&o.status=='atoffice'}).length;
  return '<nav class="nav" aria-label="التنقل"><div class="in">'+TABS[U.role].map(function(t){
    return '<button type="button" class="'+(T==t[0]?'on':'')+'" data-t="'+t[0]+'" onclick="tab(this.dataset.t)"'+(T==t[0]?' aria-current="page"':'')+'><span class="ip">'+ic(t[2],22)+(U.role=='admin'&&t[0]=='orders'&&need?'<i class="dot">'+need+'</i>':'')+(U.role=='store'&&t[0]=='mine'&&pk?'<i class="dot">'+pk+'</i>':'')+'</span><span>'+t[1]+'</span></button>'}).join('')+'</div></nav>'}
function render(){
  var a=document.getElementById('app');
  if(!U){a.innerHTML=vLogin();return}
  var body=U.role=='admin'?vAdmin():U.role=='store'?vStore():vDriver();
  a.innerHTML=headH()+navH()+'<main class="in'+(ENTER?' enter':'')+'">'+body+'</main>';ENTER=0;
  if(F){var on=document.querySelector('.chp.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'})}
}
document.getElementById('app').addEventListener('click',function(e){
  var c=e.target.closest?e.target.closest('[data-oid]'):null;

S=load();autoClose();
try{var su=localStorage.getItem('af_u');U=S.users.filter(function(a){return a.u==su})[0]||null;
  if(U){T=home(U.role);var st=localStorage.getItem('af_t');if(TABS[U.role].some(function(x){return x[0]==st}))T=st}}catch(e){}
render();
