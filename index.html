<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071A22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عين الفرس">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>عين الفرس – إدارة التوصيل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: the company emblem sets the look. Cream ground and sky-blue ink taken from the logo; a quiet cream app bar
   carrying the winged emblem, white cards, one sky-blue block for the headline figure with the wing's stripes in its
   corner. One column that widens to a card grid on desktop, bottom tab bar on phones, order cards styled like parcel
   labels (dashed tear line), bottom sheets for details and confirmations.
   The logo blue is too light to carry white text, so text on it is deep navy (--on-sky); small blue text uses --nav-on. */
:root{
  --bg:#FFF9ED;--surface:#FFFFFF;--surface-2:#F6EEDD;--ink:#0A2A38;--ink-2:#4D6672;--line:#E8DFCB;
  --brand:#01A8DC;--on-sky:#04222E;--brand-2:#01A8DC;--on-brand:#04222E;--on-brand-2:#06303F;--hl:rgba(255,255,255,.3);
  --accent:#01A8DC;--on-accent:#04222E;--accent-soft:#DDF1FA;
  --sel:#01A8DC;--on-sel:#04222E;--nav-on:#0074A4;--focus:#0074A4;--ring:rgba(1,168,220,.28);
  --ok:#17794A;--on-ok:#FFFFFF;--ok-bg:#DCF1E5;--ok-fg:#0F5C37;
  --info-bg:#DDF1FA;--info-fg:#005F87;
  --pend-bg:#ECE8DF;--pend-fg:#565F66;
  --bad:#B3362A;--on-bad:#FFFFFF;--bad-bg:#F8E0DC;--bad-fg:#8F2A20;
  --warn-bg:#F8EBCB;--warn-fg:#7A5200;
  --shadow:0 1px 2px rgba(10,42,56,.06),0 8px 24px rgba(10,42,56,.09);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --display:"Amiri","Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  direction:rtl;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071A22;--surface:#0E2631;--surface-2:#163441;--ink:#EAF5FA;--ink-2:#9AB5C2;--line:#21404E;
  --brand:#2BB5E6;--on-sky:#04222E;--brand-2:#0B5F86;--on-brand:#FFFFFF;--on-brand-2:#CBE9F6;--hl:rgba(255,255,255,.16);
  --accent:#2BB5E6;--on-accent:#04222E;--accent-soft:#113747;
  --sel:#2BB5E6;--on-sel:#04222E;--nav-on:#5CCBF2;--focus:#5CCBF2;--ring:rgba(43,181,230,.3);
  --ok:#4CC589;--on-ok:#06180F;--ok-bg:#16382A;--ok-fg:#7BDCA9;
  --info-bg:#113747;--info-fg:#7FD3F5;
  --pend-bg:#1C3440;--pend-fg:#B5C8D1;
  --bad:#EE7D70;--on-bad:#2B0A06;--bad-bg:#432019;--bad-fg:#F4A196;
  --warn-bg:#3A2F14;--warn-fg:#F0C463;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071A22;--surface:#0E2631;--surface-2:#163441;--ink:#EAF5FA;--ink-2:#9AB5C2;--line:#21404E;
  --brand:#2BB5E6;--on-sky:#04222E;--brand-2:#0B5F86;--on-brand:#FFFFFF;--on-brand-2:#CBE9F6;--hl:rgba(255,255,255,.16);
  --accent:#2BB5E6;--on-accent:#04222E;--accent-soft:#113747;
  --sel:#2BB5E6;--on-sel:#04222E;--nav-on:#5CCBF2;--focus:#5CCBF2;--ring:rgba(43,181,230,.3);
  --ok:#4CC589;--on-ok:#06180F;--ok-bg:#16382A;--ok-fg:#7BDCA9;
  --info-bg:#113747;--info-fg:#7FD3F5;
  --pend-bg:#1C3440;--pend-fg:#B5C8D1;
  --bad:#EE7D70;--on-bad:#2B0A06;--bad-bg:#432019;--bad-fg:#F4A196;
  --warn-bg:#3A2F14;--warn-fg:#F0C463;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit}
a{color:inherit}
.in{width:100%;max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:grid;gap:14px;padding-block:16px 28px}
main>*{min-width:0}
.mu{color:var(--ink-2);font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ic{flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* app bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.3;color:var(--brand);white-space:nowrap}
.me{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;color:inherit;cursor:pointer;padding:4px 6px 4px 10px;border-radius:16px;transition:background .15s}
.me:hover,.me:active{background:var(--surface-2)}
.me-t{min-width:0;line-height:1.25;text-align:end}
.me-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
.me-t span{font-size:12px;color:var(--ink-2)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-sky);display:grid;place-items:center;font-weight:700;flex:none}
.me .ic:last-child{color:var(--ink-2)}
.logo{display:block;flex:none;color:var(--brand)}

/* navigation: bottom bar on phones, pills on desktop */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;gap:4px;padding-block:6px}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink-2);font-size:11.5px;font-weight:600;padding:4px 2px;border-radius:12px;cursor:pointer}
.nav button.on{color:var(--nav-on)}
.ip{position:relative;display:grid;place-items:center;height:30px;width:58px;border-radius:99px;transition:background .18s}
.nav button.on .ip{background:var(--accent-soft)}
.dot{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 4px}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-fg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:36px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px}
.f{display:grid;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 4px var(--ring)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.err{min-height:20px;color:var(--bad-fg);font-size:13.5px;font-weight:600}
.pw{position:relative;direction:ltr}
.pw input{padding-inline-end:50px}
.eye{position:absolute;inset-inline-end:3px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;background:none;border:0;color:var(--ink-2);cursor:pointer;border-radius:10px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ct{font-size:15px;font-weight:700;margin-bottom:10px}
.pg h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.35;text-wrap:balance}
.pg p{margin-top:2px;color:var(--ink-2);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--pend-bg);color:var(--pend-fg)}
.badge.out{background:var(--info-bg);color:var(--info-fg)}
.badge.delivered{background:var(--ok-bg);color:var(--ok-fg)}
.badge.failed{background:var(--bad-bg);color:var(--bad-fg)}
.badge.atoffice{background:var(--warn-bg);color:var(--warn-fg)}
.badge.returned{background:var(--surface-2);color:var(--ink-2)}
.note{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.urow .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.why{font-size:13px;font-weight:600;color:var(--warn-fg);background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.ret{border-color:var(--warn-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.code{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--surface-2);border-radius:8px;padding:2px 9px;font-weight:700;letter-spacing:.04em;font-size:14px;font-variant-numeric:tabular-nums}

/* filters */
.tools{display:grid;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chp{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s}
.chp b{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chp.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.chp.on b{color:inherit}
.chp.hot b{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search input{padding-inline-start:44px}

/* order cards */
.ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.oc{display:grid;gap:10px;padding:14px;cursor:pointer;transition:border-color .15s}
.oc:hover{border-color:var(--ink-2)}
.oc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc-w{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{display:inline-flex;align-items:center;gap:4px;min-width:0;background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;text-align:start}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .ic{color:var(--ink-2)}
.addr{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.mini div{display:grid;background:var(--surface-2);border-radius:10px;padding:6px 10px;min-width:0}
.mini span{font-size:11.5px;color:var(--ink-2)}
.mini b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.oc-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;border-top:2px dashed var(--line);padding-top:10px}
.oc-f select{flex:1 1 150px;width:auto;min-height:40px}
.oc-f select.needs{border-color:var(--accent);background:var(--accent-soft)}
.st{display:inline-flex;align-items:center;gap:6px}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:0 0 0 3px transparent}}

/* driver tasks */
.tk{display:grid;gap:12px}
.tk-n{font-size:19px;font-weight:700;line-height:1.3}
.tk-a{display:flex;align-items:flex-start;gap:8px;color:var(--ink-2)}
.tk-a .ic{margin-top:3px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 12px}
.ph .ltr{font-size:16px;font-weight:600;user-select:all}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amts div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid}
.amts div:last-child{background:var(--accent-soft)}
.amts span{font-size:12.5px;color:var(--ink-2)}
.amts b{font-size:18px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .btn{padding:0 6px;gap:6px;font-size:13.5px}
.decide{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}

/* finance */
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--brand-2);color:var(--on-brand);border-radius:20px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
/* the emblem's wing stripes, fading in from the far corner */
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:min(56%,300px);z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,var(--hl) 0 9px,transparent 9px 21px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.hlab{font-size:14px;font-weight:600;color:var(--on-brand-2)}
.hn{font-weight:700;font-size:clamp(40px,13vw,56px);line-height:1.05;letter-spacing:-.01em;color:var(--on-brand);font-variant-numeric:tabular-nums}
.hn small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--on-brand-2);margin-inline-start:8px}
.calc{display:flex;flex-wrap:wrap;gap:6px 20px;border-top:1px solid var(--hl);padding-top:12px;font-size:13.5px;color:var(--on-brand-2)}
.calc b{color:var(--on-brand);font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hs{font-size:14px;color:var(--on-brand-2);text-align:end}
.hs b{color:var(--on-brand);font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:99px;background:var(--hl);overflow:hidden}
.prog i{display:block;height:100%;background:var(--on-brand);border-radius:99px;transition:width .4s ease}
.tiles{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--ink-2)}
.tile b{font-size:21px;font-variant-numeric:tabular-nums}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 6px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:700}
.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.zc{display:grid;gap:10px}
.zc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px}
.zc-f{display:flex;align-items:center;gap:8px}
.zc-f input{max-width:110px}
.zc .fee{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.av2{width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.ut{flex:1;min-width:0}
.ut b{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid}
.kv span{font-size:12.5px;color:var(--ink-2)}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.sum{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.sum b{font-variant-numeric:tabular-nums}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty .ei{width:60px;height:60px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.empty b{color:var(--ink);font-size:16px}
.empty span{max-width:30ch;font-size:14px}

/* login */
.lhero{padding-block:40px 22px;color:var(--brand)}
.lh{display:grid;justify-items:center;gap:8px;text-align:center}
.lh .logo{width:min(64vw,236px);height:auto}
.lh h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,42px);line-height:1.35}
.lbody{max-width:460px;margin:0 auto;display:grid;gap:14px;padding-bottom:28px}
.lform{display:grid;gap:14px;box-shadow:var(--shadow)}
.lform .ct{margin:0;font-size:17px}
.demo{display:grid;gap:8px;justify-items:center}

/* sheets: bottom sheet on phones, centered dialog on desktop */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;box-shadow:var(--shadow);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh .ct{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ask{font-size:17px;font-weight:600;line-height:1.5;padding-top:4px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.dl{display:grid}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dl div:last-child{border-bottom:0}
.dl span{color:var(--ink-2)}
.dl b{font-variant-numeric:tabular-nums;text-align:end}
.sub{font-size:13px;font-weight:700;color:var(--ink-2)}
.tl{display:grid;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding-inline-start:26px;padding-bottom:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;inset-inline-start:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);box-shadow:0 0 0 3px var(--surface)}
.tl li.ok::after{background:var(--ok)}
.tl li.bad::after{background:var(--bad)}
.tl li.info::after{background:var(--info-fg)}
.tl li.warn::after{background:var(--warn-fg)}
.tl b{display:block;font-size:14px}
.tl span{font-size:12.5px;color:var(--ink-2)}
.acc summary{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;color:var(--ink-2)}
.acc[open] summary::after{content:"–"}
.accb{display:grid;gap:12px;padding:14px 2px 2px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:70;box-shadow:var(--shadow);animation:pop .22s ease-out}
.toast.top{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.enter{animation:rise .26s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}

@media (min-width:780px){
  body{padding-bottom:0}
  .nav{position:static;background:transparent;border:0;padding:0}
  .nav .in{padding-block:16px 0;gap:8px}
  .nav button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;padding:8px 16px 8px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
  .nav button.on{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
  .nav button.on .ip{background:none}
  .ip{width:auto;height:auto}
  .toast{bottom:28px}
  main{padding-block:20px 40px}
  .me-t b{max-width:220px}
  .ov{align-items:center;padding:16px}
  .sheet{border-radius:22px;padding-bottom:18px}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function closeMonth(label){
  var fin=S.orders.filter(function(o){return o.status=='returned'||(o.status=='delivered'&&hasC(o)&&!dDue(o)&&!sDue(o))});
  if(!fin.length)return false;
  var dl=fin.filter(function(o){return o.status=='delivered'}),rt=fin.filter(function(o){return o.status=='returned'}),bz={};
  dl.forEach(function(o){var z=znm(o);bz[z]=(bz[z]||0)+1});
  if(CLOUD)fin.forEach(function(o){PEND.push({t:'upd',p:'orders/'+o.id,d:{ar:label}})});
  S.archive.unshift({k:label+'-'+Date.now(),t:Date.now(),label:label,date:dstr(Date.now()),total:fin.length,delivered:dl.length,returned:rt.length,cod:sum(dl,'cod'),
    fees:sum(dl,'fee'),comm:sum(dl,'comm'),drv:sum(dl,'drv'),bz:bz});
  S.orders=S.orders.filter(function(o){return fin.indexOf(o)<0});
  return true;
}
function autoClose(){
  var d=new Date(),key=ym(d),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()==d.getDate();
  if(S.period!=key){closeMonth(S.period);S.period=key;S.closedFor=''}
  else if(last&&d.getHours()>=23&&S.closedFor!=key){closeMonth(key);S.closedFor=key}
  save();
}
